name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate release keystore
        run: |
          if [ ! -f keystore/release.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -alias nm3u8dl \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=nm3u8dl-re-tui-android, OU=TUI, O=TUI, C=CN"
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'termux-tui-ci' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'termux-tui-ci' }}

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'termux-tui-ci' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'termux-tui-ci' }}

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/nm3u8dl-re-tui-android-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/nm3u8dl-re-tui-android-release.apk
          cd dist
          for f in *.apk; do
            echo "$f  $(stat -c%s "$f") bytes  sha256=$(sha256sum "$f" | cut -d' ' -f1)"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nm3u8dl-re-tui-android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
